<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f1; --card: #ffffff; --ink: #2a2522; --mute: #8c8079; --line: #efe7df; --tile: #f4ece3;
    --accent: #d97757; --soft-mix: 26%; --accent-soft: color-mix(in srgb, var(--accent) var(--soft-mix), var(--card)); --lilac: #b9a6f0; --mint: #9fd8c0; --sky: #9cc7f2; --butter: #f3d27a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1817; --card: #242120; --ink: #f3ece6; --mute: #9b8f88; --line: #332e2b; --tile: #302a27; --soft-mix: 40%; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.45 "Host Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 16px 120px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo { width: 40px; height: 40px; display: block; object-fit: contain; transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
  .logo:hover { transform: rotate(60deg) scale(1.08); }
  h1 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--mute); font-size: 13px; }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; }
  .kpi .label { color: var(--mute); font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .kpi .val { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .hint { color: var(--mute); font-size: 12px; }
  .rec .val { font-size: 19px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .rec .hint { color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 14px; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
  .chart-card { display: flex; flex-direction: column; }
  .chart { display: flex; align-items: flex-end; gap: 4px; flex: 1; min-height: 170px; }
  .bar { flex: 1; background: var(--accent-soft); border-radius: 6px 6px 3px 3px; position: relative; min-height: 3px; transition: background .15s; }
  .bar.today { background: var(--accent); }
  .bar:hover { background: var(--accent); }
  [data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 8px; white-space: nowrap; z-index: 5; pointer-events: none; }
  .axis { display: flex; justify-content: space-between; color: var(--mute); font-size: 11px; margin-top: 6px; }
  .hbar { margin-bottom: 12px; }
  .hbar .top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
  .hbar .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .top span:last-child { font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; }
  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
  .heat div { aspect-ratio: 1; border-radius: 3px; background: var(--line); position: relative; }
  .heat .l1 { background: color-mix(in srgb, var(--accent) 30%, var(--line)); }
  .heat .l2 { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .heat .l3 { background: color-mix(in srgb, var(--accent) 80%, var(--line)); }
  .heat .l4 { background: var(--accent); }
  .heat .future { background: transparent; }
  .legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; color: var(--mute); font-size: 11px; margin-top: 8px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .sessions-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .sessions-head h2 { margin: 0; }
  input[type=search] { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 7px 14px; width: 220px; max-width: 100%; }
  input[type=search]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .s { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 4px; border-top: 1px solid var(--line); }
  .s .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .s .m { color: var(--mute); font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .s .c { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; align-self: center; grid-row: span 2; font-size: 17px; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: #5cc98f; flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 #5cc98f88; } 70% { box-shadow: 0 0 0 7px #5cc98f00; } 100% { box-shadow: 0 0 0 0 #5cc98f00; } }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 99px; color: #2a2522; }
  .more { display: block; margin: 12px auto 0; }
  .note { color: var(--mute); font-size: 12px; margin-top: 22px; text-align: center; }
  .loading { color: var(--mute); padding: 60px 0; text-align: center; }

  .tabs { display: flex; gap: 8px; margin: -6px 0 18px; flex-wrap: wrap; }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; }
  .tab img { width: 22px; height: 22px; object-fit: contain; }
  .tab .amt { color: var(--mute); font-variant-numeric: tabular-nums; font-size: 13px; }
  .tab.on { border-color: var(--accent); background: var(--accent-soft); }
  .tab.on .amt { color: var(--ink); }
  .tl { width: 16px; height: 16px; flex: none; object-fit: contain; }
  .est { color: var(--mute); font-weight: 500; font-size: 12px; }

  /* buddy */
  #pet { position: fixed; right: 20px; bottom: 14px; z-index: 10; cursor: pointer; user-select: none; }
  #pet .sprite { overflow: hidden; margin-left: auto; filter: drop-shadow(0 6px 6px #0002); }
  #pet .sprite img { display: block; max-width: none; image-rendering: pixelated; }
  #pet svg { display: block; width: 72px; margin-left: auto; shape-rendering: crispEdges; filter: drop-shadow(0 6px 6px #0002); }
  #pet [hidden] { display: none; }
  #pet:active .sprite, #pet:active svg { transform: scale(.92); }
  #pet .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.15); } }
  .bubble::after { content: ''; position: absolute; right: 26px; bottom: -4px; width: 10px; height: 10px; background: inherit; transform: rotate(45deg); }
  .bubble { position: absolute; right: 0; bottom: calc(100% + 10px); background: var(--ink); color: var(--bg); font-weight: 500; border-radius: 14px 14px 4px 14px; padding: 8px 12px; font-size: 13px; width: max-content; max-width: 230px; box-shadow: 0 8px 24px -10px #0004; opacity: 0; translate: 0 6px; transition: opacity .2s, translate .2s; pointer-events: none; }
  #pet.talk .bubble, #pet:hover .bubble { opacity: 1; translate: 0 0; }
  .heart { position: fixed; pointer-events: none; color: var(--accent); font-size: 16px; animation: float 1.1s ease-out forwards; z-index: 11; }
  @keyframes float { to { transform: translate(var(--dx), -70px) scale(1.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" id="hlogo" src="/logo.png" alt="">
    <div>
      <h1 id="htitle">Claude Tab</h1>
      <div class="sub" id="updated">what your sessions would cost at API rates</div>
    </div>
    <div class="spacer"></div>
    <button id="refresh">Refresh</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="app" class="loading">Reading your session logs… the first run takes a minute.</div>
  <p class="note">Estimated from token usage in ~/.claude/projects at Anthropic list prices. Runs locally; nothing leaves this machine.</p>
</main>

<div id="pet" role="button" tabindex="0" aria-label="Pet your Claude buddy">
  <div class="bubble" id="bubble">hi! counting your tokens…</div>
  <svg viewBox="0 0 13 9" id="petsvg"></svg>
  <div class="sprite" id="petbox" hidden><img id="petimg" alt=""></div>
</div>

<script>
const COLORS = ['var(--accent)', 'var(--lilac)', 'var(--mint)', 'var(--sky)', 'var(--butter)', '#e7a6c4', '#c9c0b8'];
const $ = s => document.querySelector(s);
const money = v => v >= 100 ? '$' + Math.round(v).toLocaleString() : '$' + v.toFixed(2);
const nice = m => /^gpt-|^gemini-|^codex/.test(m || '')
  ? m.replace(/-n$/, '').replace(/^gpt-/, 'GPT-').replace(/^gemini-/, 'Gemini ').replace(/^codex-auto-review$/, 'Codex auto-review').replace(/^codex$/, 'Codex')
      .replace(/-(sol|luna|astra|flash|pro)$/, (_, w) => ' ' + w[0].toUpperCase() + w.slice(1))
  : (m || '?').replace(/-\d{8}$/, '').replace(/^claude-/, '').replace(/-(\d)-(\d)$/, ' $1.$2').replace(/-(\d)$/, ' $1').replace(/^\w/, c => c.toUpperCase());
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtDay = (d, o = { month: 'short', day: 'numeric' }) => d.toLocaleDateString(undefined, o);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LIVE_MS = 5 * 60000;
let raw, data, stats, modelColor = {}, shown = 25, query = '';
const TOOLS = { all: ['All tools', null], claude: ['Claude Code', '/logo.png'], codex: ['Codex', '/codex.svg'], antigravity: ['Antigravity', '/antigravity.svg'] };
// Per-tool theme: accent colour, header title, header logo.
const THEME = {
  all: ['#d97757', 'AI Tab', '/logo.png'],
  claude: ['#d97757', 'Claude Tab', '/logo.png'],
  codex: ['#6d7cff', 'Codex Tab', '/codex.svg'],
  antigravity: ['#4285f4', 'Antigravity Tab', '/antigravity.svg'],
};
function applyTheme() {
  const [accent, title, logo] = THEME[tool];
  document.documentElement.style.setProperty('--accent', accent);
  $('#htitle').textContent = title; document.title = title;
  if (!$('#hlogo').src.endsWith(logo)) $('#hlogo').src = logo;
}
let tool = 'all';
try { tool = localStorage.getItem('tool') || 'all'; } catch {}

function view(t) {
  const v = { sessions: [], days: {}, models: {} };
  for (const x of t === 'all' ? Object.values(raw.tools) : [raw.tools[t]]) {
    v.sessions.push(...x.sessions);
    for (const [d, c] of Object.entries(x.days)) v.days[d] = (v.days[d] || 0) + c;
    Object.assign(v.models, x.models);
  }
  v.sessions.sort((a, b) => b.end - a.end);
  return v;
}
function renderTabs() {
  const total = t => Object.values(view(t).days).reduce((a, b) => a + b, 0);
  $('#tabs').innerHTML = Object.entries(TOOLS).filter(([k]) => k === 'all' || raw.tools[k]?.sessions.length).map(([k, [name, logo]]) =>
    `<button class="tab${k === tool ? ' on' : ''}" data-t="${k}">${logo ? `<img src="${logo}" alt="">` : ''}${name} <span class="amt">${money(total(k))}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    tool = b.dataset.t; shown = 25; try { localStorage.setItem('tool', tool); } catch {}
    renderTabs(); applyTheme(); data = view(tool); render();
  });
}

function computeStats() {
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const week = new Date(today); week.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const month = new Date(now.getFullYear(), now.getMonth(), 1);
  const since = from => Object.entries(data.days).reduce((a, [d, c]) => new Date(d + 'T00:00') >= from ? a + c : a, 0);
  const dayEntries = Object.entries(data.days).filter(([, c]) => c > 0.005).sort();
  const total = dayEntries.reduce((a, [, c]) => a + c, 0);
  const topDay = dayEntries.reduce((a, b) => b[1] > (a?.[1] ?? -1) ? b : a, null);
  // streaks of consecutive active days
  let best = 0, run = 0, prev = null;
  for (const [d] of dayEntries) { const t = new Date(d + 'T00:00'); run = prev && (t - prev) / 864e5 < 1.5 ? run + 1 : 1; best = Math.max(best, run); prev = t; }
  let cur = 0; for (let d = new Date(today); data.days[dayKey(d)] > 0.005; d.setDate(d.getDate() - 1)) cur++;
  const projects = {};
  for (const s of data.sessions) projects[s.project] = (projects[s.project] || 0) + s.cost;
  const last30 = []; for (let i = 0; i < 30; i++) { const d = new Date(today); d.setDate(today.getDate() - i); const c = data.days[dayKey(d)]; if (c > 0.005) last30.push(c); }
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const monthSoFar = since(month), elapsed = (now - month) / 864e5;
  return {
    now, today, todayCost: since(today), week: since(week), month: monthSoFar, total,
    pace: monthSoFar / Math.max(elapsed, 0.5) * daysInMonth,
    avgDay: last30.length ? last30.reduce((a, b) => a + b, 0) / last30.length : 0,
    topDay, best, cur,
    topSession: data.sessions.reduce((a, b) => b.cost > (a?.cost ?? -1) ? b : a, null),
    projects: Object.entries(projects).filter(([, c]) => c >= 0.01).sort((a, b) => b[1] - a[1]),
    live: data.sessions.filter(s => Date.now() - s.end < LIVE_MS),
    todaySessions: data.sessions.filter(s => s.end >= +today).length,
  };
}

function heatmap(today) {
  const weeks = 26, start = new Date(today);
  start.setDate(today.getDate() - ((today.getDay() + 6) % 7) - (weeks - 1) * 7); // Monday, 26 weeks back
  const vals = Object.values(data.days).filter(c => c > 0.005).sort((a, b) => a - b);
  const q = p => vals[Math.floor(p * (vals.length - 1))] ?? 0;
  const [q1, q2, q3] = [q(.25), q(.5), q(.75)];
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (d > today) { cells += '<div class="future"></div>'; continue; }
    const c = data.days[dayKey(d)] || 0;
    const l = c <= 0.005 ? 0 : c <= q1 ? 1 : c <= q2 ? 2 : c <= q3 ? 3 : 4;
    cells += `<div class="l${l}" data-tip="${fmtDay(d)} · ${money(c)}"></div>`;
  }
  return `<div class="heat">${cells}</div>
    <div class="legend">less <i style="background:var(--line)"></i><i class="l1" style="background:color-mix(in srgb,var(--accent) 30%,var(--line))"></i><i style="background:color-mix(in srgb,var(--accent) 55%,var(--line))"></i><i style="background:color-mix(in srgb,var(--accent) 80%,var(--line))"></i><i style="background:var(--accent)"></i> more</div>`;
}

const hbars = (rows, color) => rows.map(([name, v], i) => `<div class="hbar"><div class="top"><span>${esc(name)}</span><span>${money(v)}</span></div><div class="track"><div class="fill" style="width:${v / (rows[0][1] || 1) * 100}%;background:${color(name, i)}"></div></div></div>`).join('');

function render() {
  const st = stats = computeStats();
  const models = Object.entries(data.models).filter(([, m]) => m.priced).sort((a, b) => b[1].cost - a[1].cost);
  models.forEach(([m], i) => modelColor[m] = COLORS[Math.min(i, COLORS.length - 1)]);
  const days = [];
  for (let i = 29; i >= 0; i--) { const d = new Date(st.today); d.setDate(st.today.getDate() - i); days.push([d, data.days[dayKey(d)] || 0]); }
  const max = Math.max(...days.map(d => d[1]), 0.01);
  const kpi = (label, val, hint, color) => `<div class="card kpi"><div class="label"><span class="dot" style="background:${color}"></span>${label}</div><div class="val">${money(val)}</div><div class="hint">${hint}</div></div>`;
  const rec = (label, val, hint) => `<div class="card rec"><div class="sub">${label}</div><div class="val">${val}</div><div class="hint" title="${esc(hint)}">${esc(hint)}</div></div>`;
  const q = query.toLowerCase();
  const list = data.sessions.filter(s => !q || (s.title || '').toLowerCase().includes(q) || s.project.toLowerCase().includes(q));
  const n = data.sessions.length;

  $('#app').className = '';
  $('#app').innerHTML = `
    <div class="grid4">
      ${kpi('Today', st.todayCost, `${st.todaySessions} sessions${st.live.length ? ` · ${st.live.length} live` : ''}`, 'var(--accent)')}
      ${kpi('This week', st.week, 'since Monday', 'var(--lilac)')}
      ${kpi('This month', st.month, `on pace for ${money(st.pace)}`, 'var(--mint)')}
      ${kpi('All time', st.total, `${n} sessions · ${money(n ? st.total / n : 0)} avg`, 'var(--butter)')}
    </div>
    <div class="row">
      <div class="card chart-card">
        <h2>Last 30 days</h2>
        <div class="chart">${days.map(([d, c], i) => `<div class="bar${i === 29 ? ' today' : ''}" style="height:${Math.max(2, c / max * 100)}%" data-tip="${fmtDay(d)} · ${money(c)}"></div>`).join('')}</div>
        <div class="axis"><span>${fmtDay(days[0][0])}</span><span>today</span></div>
      </div>
      <div class="card"><h2>By model</h2>${hbars(models.slice(0, 8).map(([m, v]) => [nice(m), v.cost]), (_, i) => modelColor[models[i][0]])}</div>
    </div>
    <div class="grid4">
      ${rec('Priciest day', st.topDay ? money(st.topDay[1]) : '–', st.topDay ? fmtDay(new Date(st.topDay[0] + 'T00:00'), { weekday: 'short', month: 'short', day: 'numeric' }) : '')}
      ${rec('Priciest session', st.topSession ? money(st.topSession.cost) : '–', st.topSession?.title || '')}
      ${rec('Current streak', st.cur + (st.cur === 1 ? ' day' : ' days'), `best: ${st.best} days in a row`)}
      ${rec('Typical day', money(st.avgDay), 'average active day, last 30')}
    </div>
    <div class="row">
      <div class="card"><h2>Last 6 months</h2>${heatmap(st.today)}</div>
      <div class="card"><h2>By project</h2>${hbars(st.projects.slice(0, 6), (_, i) => COLORS[(i + 1) % COLORS.length])}</div>
    </div>
    <div class="card">
      <div class="sessions-head"><h2>Sessions</h2><div class="spacer"></div><input type="search" id="q" placeholder="Search sessions" value="${esc(query)}"></div>
      ${list.slice(0, shown).map(s => {
        const mins = Math.max(1, Math.round((s.end - s.start) / 60000));
        const live = Date.now() - s.end < LIVE_MS;
        return `<div class="s">
          <div class="t">${live ? '<span class="live" title="active in the last 5 min"></span>' : ''}${tool === 'all' ? `<img class="tl" src="${TOOLS[s.tool][1]}" alt="${TOOLS[s.tool][0]}" title="${TOOLS[s.tool][0]}">` : ''}<span style="overflow:hidden;text-overflow:ellipsis">${esc(s.title || 'Untitled session')}</span></div>
          <div class="c">${s.estimate ? '<span class="est" title="Codex only records total tokens, so this is a rough estimate">~</span>' : ''}${money(s.cost)}</div>
          <div class="m"><span class="chip" style="background:${modelColor[s.model] || '#ddd'}">${nice(s.model)}</span>
            <span>${esc(s.project)}</span><span>${new Date(s.end).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
            ${s.start !== s.end ? `<span>${mins < 60 ? mins + ' min' : (mins / 60).toFixed(1) + ' h'}</span>` : ''}<span>${s.tout ? `${(s.tin / 1e6).toFixed(1)}M in · ${(s.tout / 1e3).toFixed(0)}K out` : `${(s.tin / 1e6).toFixed(1)}M tokens`}</span></div>
        </div>`;
      }).join('')}
      ${list.length > shown ? `<button class="more" id="more">Show more (${list.length - shown} left)</button>` : ''}
    </div>`;
  $('#q').oninput = e => { query = e.target.value; shown = 25; render(); const el = $('#q'); el.focus(); el.setSelectionRange(query.length, query.length); };
  if ($('#more')) $('#more').onclick = () => { shown += 50; render(); };
  $('#updated').textContent = 'updated ' + new Date(raw.generated).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) + ' · API-rate estimate';
  updatePet();
}

/* ---------- pixel buddy ---------- */
// Moods: sleepy (nothing today), working (a session is live), sweaty (way above a typical day), party (record day), happy.
function mood() {
  const st = stats;
  if (st.topDay && st.topDay[0] === dayKey(st.today) && st.todayCost > 1) return 'party';
  if (st.todayCost > 2 * st.avgDay && st.avgDay > 0) return 'sweaty';
  if (st.live.length) return 'working';
  if (st.todayCost < 0.01) return 'sleepy';
  return 'happy';
}
const LATTE = 5.5;
function lines(m) {
  const st = stats, t = money(st.todayCost), lattes = (st.todayCost / LATTE).toFixed(st.todayCost < LATTE * 3 ? 1 : 0);
  const common = [
    `today is ${t}. that's ${lattes} lattes ☕`,
    `on pace for ${money(st.pace)} this month`,
    st.topSession ? `biggest session ever: "${st.topSession.title || 'untitled'}" at ${money(st.topSession.cost)}` : 'no sessions yet!',
    `${st.cur}-day streak. keep it going?`,
    'thanks for the pets ♥',
  ];
  return {
    sleepy: ['zzz… no tokens today', 'nap mode. wake me with a prompt', ...common.slice(1)],
    working: [`cooking… ${t} so far today`, `${st.live.length} session${st.live.length > 1 ? 's' : ''} running right now`, ...common],
    sweaty: [`${t} today?! that's ${lattes} lattes 😅`, `a typical day is ${money(st.avgDay)}…`, ...common],
    party: [`new record day! ${t} 🎉`, 'party hat earned', ...common],
    happy: common,
  }[m];
}
// Happy uses the hand-drawn pixel buddy; other moods and click costumes use images.
// [src, full w, full h, crop x, crop y, crop w, crop h, body width in px], scaled so the body is BODY px wide.
const BODY = 50;
const clawd = name => [`/clawd/${name}.gif`, 128, 128, 0, 0, 128, 128, 64]; // ClawdMoji scenes, shown whole
const PET_IMG = {
  working: ['/pet-walk.gif', 200, 200, 5, 70, 135, 95, 85],
  sleepy: ['/pet-think.gif', 480, 480, 75, 40, 315, 390, 210],
  sweaty: clawd('clawd-fine'),   // calm in a burning room
  party: clawd('clawd-mariachi'),
  // click costumes
  shock: ['/pet-shock.png', 894, 640, 115, 65, 665, 535, 445],
  surf: clawd('clawd-surf'), rain: clawd('clawd-rain'), bugs: clawd('clawd-bugcatcher'),
  hood: clawd('clawd-robinhood'), disguise: clawd('definitely-not-clawd'),
};
const COSTUMES = ['shock', 'surf', 'rain', 'bugs', 'hood', 'disguise'];
// Same proportions as the walking sprite: 9-wide body, side arms, 4 legs with a wide middle gap.
function pixelPet(m) {
  const O = '#d97757', D = '#1b1817', px = (x, y, w, h, c, cls = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" class="${cls}"/>`;
  const eyes = m === 'party'
    ? px(3, 1, 1, 1, D) + px(9, 1, 1, 1, D) + px(2.5, 2, .5, .5, D) + px(4, 2, .5, .5, D) + px(8.5, 2, .5, .5, D) + px(10, 2, .5, .5, D) // ^ ^
    : px(3, 1, 1, 1, D, 'eye') + px(9, 1, 1, 1, D, 'eye');
  let s = px(2, 0, 9, 6, O) + px(0, 2, 2, 2, O) + px(11, 2, 2, 2, O)
    + [2, 4, 8, 10].map(x => px(x, 6, 1, 2, O)).join('') + eyes;
  if (m === 'party') s += px(6, -4, 1, 1, '#f3d27a') + px(5.5, -3, 2, 1, '#b9a6f0') + px(5, -2, 3, 1, '#b9a6f0') + px(4.5, -1, 4, 1, '#9fd8c0');
  return s;
}
function drawPet(m, costume) {
  const box = $('#petbox'), img = $('#petimg'), svg = $('#petsvg'), spec = PET_IMG[costume || m];
  box.hidden = !spec; svg.toggleAttribute('hidden', !!spec);
  if (spec) {
    const [src, W, , x, y, cw, ch, body] = spec, k = BODY / body;
    if (!img.src.endsWith(src)) img.src = src;
    Object.assign(box.style, { width: cw * k + 'px', height: ch * k + 'px' });
    Object.assign(img.style, { width: W * k + 'px', marginLeft: -x * k + 'px', marginTop: -y * k + 'px' });
  } else {
    const party = m === 'party', unit = BODY / 9;
    svg.setAttribute('viewBox', party ? '0 -4 13 12' : '0 0 13 8');
    Object.assign(svg.style, { width: 13 * unit + 'px', height: (party ? 12 : 8) * unit + 'px' });
    svg.innerHTML = pixelPet(m);
  }
  const cl = $('#pet').classList;
  cl.remove('happy', 'working', 'sleepy', 'sweaty', 'party'); cl.add(m); // keeps 'talk'
}
let lastMood, talkTimer;
function say(text, ms = 3500) {
  $('#bubble').textContent = text;
  $('#pet').classList.add('talk');
  clearTimeout(talkTimer); talkTimer = setTimeout(() => $('#pet').classList.remove('talk'), ms);
}
function updatePet() {
  const m = mood();
  drawPet(m);
  if (m !== lastMood) say(lines(m)[0]);
  else $('#bubble').textContent = lines(m)[0];
  lastMood = m;
}
let pick = 0;
function pet(e) {
  if (!stats) return;
  const r = $('#pet').getBoundingClientRect();
  for (let i = 0; i < 5; i++) {
    const h = document.createElement('div'); h.className = 'heart'; h.textContent = '♥';
    h.style.left = r.left + r.width / 2 - 8 + 'px'; h.style.top = r.top + 10 + 'px';
    h.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px'); h.style.animationDelay = i * 60 + 'ms';
    document.body.appendChild(h); setTimeout(() => h.remove(), 1400);
  }
  const m = mood(), ls = lines(m); pick = (pick + 1) % ls.length; say(ls[pick]);
  drawPet(m, COSTUMES[Math.floor(Math.random() * COSTUMES.length)]);
  clearTimeout(costumeTimer); costumeTimer = setTimeout(() => drawPet(mood()), 4000);
}
let costumeTimer;
$('#pet').onclick = pet;
$('#pet').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pet(); } };
drawPet('happy');

async function load() {
  $('#refresh').textContent = 'Refreshing…';
  try {
    raw = await (await fetch('/api/data')).json();
    if (!raw.tools[tool] && tool !== 'all') tool = 'all';
    data = view(tool);
    renderTabs(); applyTheme(); render();
  }
  catch (e) { $('#app').textContent = 'Could not read logs: ' + e; }
  $('#refresh').textContent = 'Refresh';
}
$('#refresh').onclick = load;
load();
setInterval(load, 60000);
</script>
</body>
</html>
